name: AYDA A1 Preview Quality Gate
on:
  push:
    branches: [main]
    paths:
      - 'preview/**'
      - 'index.html'
      - 'ayda-a1-*.js'
      - 'ayda-a1-*.css'
      - 'ayda-brand.js'
      - 'backups/a1-index-before-unified-20261016.html'
      - 'scripts/check-a1-integrity.mjs'
      - 'scripts/smoke-a1.cjs'
      - '.github/workflows/ayda-a1-preview-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-a1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live files and all A1 study content unchanged
        run: node scripts/check-a1-integrity.mjs
      - name: Install browser test driver
        run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Test approved A1 preview — 24 lessons, videos and mobile
        run: node scripts/smoke-a1.cjs
      - name: Test A1 production root — same course and interactions
        env:
          AYDA_TEST_PATH: '/'
        run: node scripts/smoke-a1.cjs
      - name: Preserve mobile screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ayda-a1-mobile-preview
          path: screenshots/a1-mobile-preview.png
          if-no-files-found: ignore
          retention-days: 5
