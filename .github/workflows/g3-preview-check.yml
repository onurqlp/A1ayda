name: G3 Corporate Preview Browser Check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/g3-preview-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: python -m pip install selenium
      - name: Check A1 preview on desktop and mobile
        run: |
          mkdir -p /tmp/g3
          python - <<'PY'
          import time,json
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          o=Options()
          for x in ['--headless=new','--no-sandbox','--disable-dev-shm-usage']:o.add_argument(x)
          d=webdriver.Chrome(options=o)
          try:
            for name,w,h in [('desktop',1440,900),('mobile',390,844)]:
              d.set_window_size(w,h)
              d.get('https://onurqlp.github.io/A1ayda/g3-onizleme/?qa='+str(time.time()))
              time.sleep(4)
              z=d.execute_script("""const logo=document.querySelector('.g3-logo img');const box=document.querySelector('#aydaLoginBox');return {title:document.title,header:!!document.querySelector('.g3-header'),logo:!!logo&&logo.complete&&logo.naturalWidth>0,logoWidth:logo?.getBoundingClientRect().width,login:!!box&&getComputedStyle(box).display!=='none',field:!!document.querySelector('#aydaPasswordInput'),root:!!document.querySelector('#root'),overflow:document.documentElement.scrollWidth-innerWidth,error:document.querySelector('#aydaLoginMessage')?.textContent}""")
              print(json.dumps({'screen':name,'checks':z},ensure_ascii=False),flush=True)
              d.save_screenshot('/tmp/g3/'+name+'.png')
              assert z['header'] and z['logo'] and z['login'] and z['field'] and z['root'] and z['overflow']<=4
            print('G3_PREVIEW_DESKTOP_MOBILE_OK',flush=True)
          finally:d.quit()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g3-preview-browser-evidence
          path: /tmp/g3/*.png
          retention-days: 7
