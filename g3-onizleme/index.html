    <style>
      #aydaLoginBox {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: grid;
        place-items: center;
        min-height: 100dvh;
        padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        overflow-y: auto;
        background:
          radial-gradient(circle at top left, rgba(35, 64, 120, 0.14), transparent 34%),
          linear-gradient(180deg, #f8fbff 0%, #eef3fb 100%);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        color: #1f2937;
      }

      #aydaLoginBox .ayda-login-card {
        width: min(100%, 430px);
        background: #ffffff;
        border: 1px solid #dce3f0;
        border-radius: 28px;
        padding: clamp(22px, 5vw, 30px);
        box-shadow: 0 20px 50px rgba(35, 64, 120, 0.18);
      }

      #aydaLoginBox .ayda-login-logo {
        width: 58px;
        height: 58px;
        display: grid;
        place-items: center;
        margin-bottom: 16px;
        border-radius: 18px;
        background: #234078;
        color: #ffffff;
        font-size: 20px;
        font-weight: 900;
      }

      #aydaLoginBox h1 {
        margin: 0 0 8px;
        color: #172b52;
        font-size: clamp(22px, 6vw, 25px);
        line-height: 1.2;
        letter-spacing: -0.03em;
      }

      #aydaLoginBox p {
        margin: 0 0 18px;
        color: #6b7280;
        font-size: 14px;
        line-height: 1.5;
      }

      #aydaLoginBox .ayda-password-row {
        display: flex;
        gap: 10px;
      }

      #aydaPasswordInput {
        flex: 1;
        min-width: 0;
        min-height: 50px;
        border: 1px solid #dce3f0;
        border-radius: 16px;
        padding: 14px 15px;
        background: #ffffff;
        color: #1f2937;
        font: inherit;
        font-size: 16px;
        outline: none;
      }

      #aydaPasswordInput:focus {
        border-color: #234078;
        box-shadow: 0 0 0 4px rgba(35, 64, 120, 0.10);
      }

      #aydaLoginBox .ayda-login-btn {
        min-height: 50px;
        border: 0;
        border-radius: 16px;
        padding: 0 18px;
        background: #234078;
        color: #ffffff;
        font: inherit;
        font-weight: 900;
        cursor: pointer;
      }

      #aydaLoginBox .ayda-login-btn:hover { background: #172b52; }
      #aydaLoginBox .ayda-login-btn:focus-visible { outline: 3px solid #79a7f0; outline-offset: 3px; }

      #aydaLoginMessage {
        min-height: 18px;
        margin-top: 12px;
        color: #dc2626;
        font-size: 13px;
        font-weight: 700;
      }

      #aydaProtectedContent { display: none; }

      @media (max-width: 680px) {
        #aydaLoginBox .ayda-password-row { flex-direction: column; }
        #aydaLoginBox .ayda-login-btn { padding: 14px 18px; }
      }

      @media (max-width: 360px) {
        #aydaLoginBox { padding: 12px; }
        #aydaLoginBox .ayda-login-card { border-radius: 20px; padding: 20px; }
      }

      @media (max-height: 520px) and (orientation: landscape) {
        #aydaLoginBox { place-items: start center; }
        #aydaLoginBox .ayda-login-logo { width: 46px; height: 46px; margin-bottom: 10px; border-radius: 14px; }
      }
    </style>
